services:
  pm-app:
    build: .
    container_name: pm-app
    restart: unless-stopped
    # 仅暴露给宿主机回环，公网由 Nginx(443) 反代，勿将 3000 对公网开放
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      # 以下为容器内固定值，覆盖 .env 中的本地路径
      PORT: "3000"
      DB_PATH: /app/data/pm.db
      ATTACHMENT_ROOT: /app/data/attachments
      ALLOW_DEV_LOGIN: "false"
    volumes:
      - pm-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pm-data:
