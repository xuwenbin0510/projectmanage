# Render 部署蓝图（Blueprint）
# 用法：Render 控制台 → New → Blueprint → 连接本 GitHub 仓库 → 自动按此文件部署。
# 文档：https://render.com/docs/blueprint-spec
services:
  - type: web
    name: astrbytes-pm
    runtime: node
    plan: free              # 免费额度；持久化数据库需升级付费计划并挂载 disk（见下方注释）
    region: singapore       # 离国内近；也可改 oregon / frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 生产务必用强随机密钥；generateValue 让 Render 自动生成并保密存储
      - key: SESSION_SECRET
        generateValue: true
      # 飞书免登凭证：留空 = 启用「开发登录」模式（输入姓名即可登录，首个用户为管理员）
      # 接飞书时在飞书开放平台拿到后填这里，并配置重定向到 https://<本服务域名>/
      - key: FEISHU_APP_ID
        value: ""
      - key: FEISHU_APP_SECRET
        value: ""
      # SQLite 文件路径；免费盘为临时文件系统，重启/重新部署会清空数据（演示够用）
      # 需要持久化：升级付费计划后挂载 disk 到 /data，并把这里改为 /data/pm.db
      - key: DB_PATH
        value: "./pm.db"
      - key: ADMIN_OPEN_IDS
        value: ""
      - key: BASE_URL
        value: ""
# 持久化数据库（可选，需付费计划）：
# 取消注释并在上面 plan 改为 starter/标准计划后生效
#    disk:
