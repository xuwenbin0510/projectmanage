# pm-app Nginx 反向代理配置
# 用法：将本文件内容写入 /etc/nginx/conf.d/pm-app.conf，改 server_name 与证书路径后
#       sudo nginx -t && sudo systemctl reload nginx

upstream pm_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name pm.yourdomain.com;   # ← 改成你的域名
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 终止 + 反向代理到容器内 Node 服务
server {
    listen 443 ssl;
    http2 on;
    server_name pm.yourdomain.com;   # ← 改成你的域名

    # 阿里云控制台申请的免费 DV 证书（下载 Nginx 格式）上传到 /etc/nginx/cert/
    ssl_certificate     /etc/nginx/cert/pm-app.pem;
    ssl_certificate_key /etc/nginx/cert/pm-app.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 附件上传上限（multer 处理 multipart，这里放宽 Nginx 侧限制）
    client_max_body_size 20m;

    location / {
        proxy_pass http://pm_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # 预留 WebSocket 支持（当前通知为轮询，无需，但留着无妨）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
