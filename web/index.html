<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5F7FA" />
    <title>太空字节项目管理</title>
    <!-- 飞书 JSSDK（内嵌免登用；非飞书环境加载失败不影响开发登录） -->
    <!-- 官方当前有效地址：lf-scm-cn.feishucdn.com/lark/op/h5-js-sdk-1.5.xx.js（旧 lf1-cdn-tos.bytegoofy.com/goofy/locale/... 已 404 失效） -->
    <script src="https://lf-scm-cn.feishucdn.com/lark/op/h5-js-sdk-1.5.48.js"></script>
    <!-- 首屏兜底背景：CSS 包在 JS bundle 里，这里先按 data-theme 上色，避免闪白/闪黑 -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      html[data-theme='light'],
      html[data-theme='light'] body,
      html[data-theme='light'] #root {
        background: #f5f7fa;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body,
      html[data-theme='dark'] #root {
        background: #0b1020;
      }
    </style>
    <!-- 首屏前置应用主题（与 src/theme/themeContext.tsx 同一 storage key） -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('pm_theme_mode');
          if (m !== 'light' && m !== 'dark') m = 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', m);
          root.style.colorScheme = m;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', m === 'dark' ? '#0B1020' : '#F5F7FA');
        } catch (e) {
          /* localStorage 不可用时走 data-theme="light" 默认值 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
