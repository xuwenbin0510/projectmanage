<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>太空字节项目管理工作台 V1.0</title>
<style>
  :root{
    --bg:#0B1120; --bg2:#0F1830; --panel:#131E36; --panel2:#17213C;
    --border:#26324B; --border2:#324063;
    --text:#E6EDF6; --muted:#8A99B5; --faint:#5C6B88;
    --accent:#38BDF8; --accent2:#3B82F6; --warn:#F59E0B; --danger:#F87171; --ok:#34D399;
    --A:#F59E0B; --B:#38BDF8; --C:#A78BFA;
    --s-draft:#64748B; --s-review:#F59E0B; --s-approved:#38BDF8; --s-active:#34D399; --s-done:#64748B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, #15233f 0%, var(--bg) 55%) fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    font-size:15px; line-height:1.5; min-height:100vh;
  }
  .wrap{max-width:1120px; margin:0 auto; padding:14px 16px 96px;}
  header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 0 10px; border-bottom:1px solid var(--border); margin-bottom:14px;}
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto;}
  .brand .logo{width:42px; height:42px; border-radius:11px; flex:0 0 auto; background:linear-gradient(135deg,#0ea5e9,#6366f1); display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 1px #2b3a5e, 0 6px 18px rgba(56,189,248,.25);}
  .brand h1{font-size:18px; margin:0; font-weight:700; letter-spacing:.3px;}
  .brand .sub{font-size:11px; color:var(--muted); margin-top:1px;}
  .acts{display:flex; gap:8px; flex-wrap:wrap;}
  button,.btn{font-family:inherit; font-size:14px; cursor:pointer; border:none; border-radius:9px; padding:9px 13px; min-height:44px; background:var(--panel2); color:var(--text); border:1px solid var(--border); transition:.15s; display:inline-flex; align-items:center; gap:6px; justify-content:center;}
  button:hover,.btn:hover{border-color:var(--accent);}
  button.primary{background:linear-gradient(135deg,#0ea5e9,#3b82f6); border-color:transparent; color:#04121f; font-weight:700;}
  button.ghost{background:transparent;}
  button.danger{color:var(--danger); border-color:#5b2a2a;}
  button.mini{min-height:34px; padding:6px 10px; font-size:13px; border-radius:8px;}
  .hint{font-size:12px; color:var(--muted); background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:8px 12px; margin:0 0 12px;}
  .today{background:linear-gradient(180deg,#13203b,#0f1830); border:1px solid var(--border2); border-radius:14px; padding:14px; margin-bottom:16px;}
  .today h2{font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:8px; color:var(--accent);}
  .today-list{display:flex; flex-direction:column; gap:8px;}
  .today-item{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
  .today-item.over{border-color:#5b2a2a; background:#1a0f12;}
  .today-item .tx{flex:1; min-width:0;}
  .today-item .tx b{font-weight:600;}
  .today-item .tx small{display:block; color:var(--muted); font-size:12px;}
  .today-item .tag{font-size:11px; padding:2px 8px; border-radius:20px; background:var(--panel2); color:var(--muted);}
  .today-empty{color:var(--muted); font-size:13px; padding:6px 2px;}
  nav{display:flex; gap:6px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:6px; margin-bottom:16px; position:sticky; top:0; z-index:5;}
  nav button{flex:1; background:transparent; border-color:transparent; color:var(--muted); border-radius:9px;}
  nav button.on{background:var(--panel2); color:var(--text); border-color:var(--border2); font-weight:700;}
  .module{display:none;} .module.on{display:block;}
  .module-head{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
  .module-head h2{font-size:17px; margin:0; font-weight:700;}
  .module-head .sp{margin-left:auto;}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:14px;}
  .panel h3{font-size:14px; margin:0 0 12px; color:var(--muted); font-weight:600; letter-spacing:.3px;}
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px;}
  label.fld{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted);}
  input,select,textarea{font-family:inherit; font-size:16px; color:var(--text); background:var(--bg2); border:1px solid var(--border2); border-radius:9px; padding:10px 11px; width:100%; min-height:44px;}
  textarea{min-height:64px; resize:vertical; line-height:1.45;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent);}
  .row-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .toggle{font-size:13px; color:var(--accent); cursor:pointer; user-select:none;}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:13px; padding:13px; position:relative; overflow:hidden;}
  .card .topline{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .badge{font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; color:#0b1120;}
  .badge.A{background:var(--A);} .badge.B{background:var(--B);} .badge.C{background:var(--C);}
  .pill{font-size:11px; padding:3px 10px; border-radius:20px; border:1px solid var(--border2); color:var(--muted);}
  .pill.审批中{color:var(--s-review); border-color:#5b4a1f;}
  .pill.已批准{color:var(--s-approved); border-color:#1f4a5b;}
  .pill.已启动{color:var(--s-active); border-color:#1f5b3f;}
  .pill.草稿{color:var(--s-draft);}
  .pill.已结项{color:var(--muted);}
  .card h4{margin:2px 0 6px; font-size:15px; font-weight:700;}
  .card .meta{font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 12px; margin-bottom:8px;}
  .card .meta b{color:var(--text); font-weight:600;}
  .card .bg{font-size:12px; color:var(--muted); line-height:1.6; margin:2px 0 8px; padding:8px 10px; background:rgba(56,189,248,0.05); border-left:3px solid var(--accent); border-radius:0 8px 8px 0;}
  .card .bg b{color:var(--text);}
  .goals{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
  .goal{font-size:11px; background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:4px 8px; color:var(--muted);}
  .goal b{color:var(--accent);}
  .ms{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
  .ms .m{font-size:11px; padding:3px 9px; border-radius:8px; border:1px solid var(--border2); color:var(--muted); cursor:pointer; display:inline-flex; gap:5px; align-items:center;}
  .ms .m.done{color:var(--ok); border-color:#1f5b3f; background:#0d1f17;}
  .ms .m.derived{border-style:dashed;}
  .ms .m.done::before{content:"✓";}
  .ms-editor{margin-top:4px;}
  .ms-rows{display:flex; flex-direction:column; gap:8px;}
  .ms-row{display:flex; gap:8px; align-items:center;}
  .ms-row .ms-name{flex:1; min-width:0;}
  .ms-row .ms-due{width:168px; flex:0 0 auto;}
  .card .acts2{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .card .acts2 button{min-height:36px; padding:6px 10px; font-size:12px;}
  .kanban{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .kcol{background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:10px; min-height:120px;}
  .kcol h4{font-size:13px; margin:0 0 10px; display:flex; justify-content:space-between; color:var(--muted);}
  .kcol h4 .n{background:var(--panel2); border-radius:20px; padding:1px 9px; font-size:12px; color:var(--text);}
  .ktask{background:var(--panel); border:1px solid var(--border2); border-radius:10px; padding:9px; margin-bottom:9px;}
  .ktask .kc{font-size:11px; color:var(--accent); font-weight:700;}
  .ktask .kn{font-size:13px; font-weight:600; margin:2px 0 5px;}
  .ktask .ko{font-size:11px; color:var(--muted); display:flex; justify-content:space-between; gap:6px;}
  .ktask .ko .crit{color:var(--warn); font-weight:700;}
  .ktask .ko .mstag{color:var(--accent); font-weight:600;}
  .ktask.over{border-color:#5b2a2a;}
  .ktask .pbar{height:5px; background:var(--bg); border-radius:4px; margin-top:7px; overflow:hidden;}
  .ktask .pbar i{display:block; height:100%; background:linear-gradient(90deg,#0ea5e9,#34d399);}
  .ktask select{margin-top:7px; min-height:34px; font-size:13px; padding:5px 8px;}
  .ktask .del{font-size:11px; color:var(--danger); cursor:pointer; float:right; margin-top:5px;}
  .metrics{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:14px;}
  .metric{background:var(--panel); border:1px solid var(--border); border-radius:13px; padding:13px; text-align:center;}
  .metric .v{font-size:26px; font-weight:800; line-height:1.1;}
  .metric .v.ok{color:var(--ok);} .metric .v.warn{color:var(--warn);} .metric .v.danger{color:var(--danger);}
  .metric .l{font-size:12px; color:var(--muted); margin-top:4px;}
  .dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .chart-row{display:flex; gap:14px; align-items:center; flex-wrap:wrap;}
  .legend{display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--muted);}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px;}
  .bars{display:flex; flex-direction:column; gap:8px;}
  .bar{display:flex; align-items:center; gap:8px; font-size:12px;}
  .bar .nm{width:84px; flex:0 0 auto; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar .track{flex:1; height:18px; background:var(--bg2); border-radius:6px; position:relative; overflow:hidden; border:1px solid var(--border);}
  .bar .fill{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,#0ea5e9,#3b82f6); border-radius:6px;}
  .bar .txt{position:absolute; right:7px; top:0; bottom:0; display:flex; align-items:center; font-size:11px; color:var(--text);}
  .rep{background:var(--panel); border:1px solid var(--border); border-radius:11px; padding:11px 12px; margin-bottom:10px;}
  .rep .rh{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
  .rep .rh b{font-size:14px;}
  .rep .sec{font-size:12px; color:var(--muted); margin-top:5px;}
  .rep .sec b{color:var(--text);}
  .rep .tsk{font-size:12px; color:var(--accent); margin-top:4px;}
  .empty{color:var(--muted); font-size:13px; padding:10px 2px; text-align:center;}
  .ktask .edt{font-size:11px; color:var(--accent); cursor:pointer; float:right; margin:5px 8px 0 0;}
  .ktask .kfoot{margin-top:8px; padding-top:8px; border-top:1px dashed var(--border2);}
  .ktask .lk{font-size:11px; color:var(--accent); cursor:pointer; display:inline-block; padding:3px 8px; border:1px solid var(--border2); border-radius:14px;}
  .ktask .lk:hover{background:var(--panel2); border-color:var(--accent);}
  .pbar.big{height:10px; margin-top:6px;}
  .risk-fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:8px; margin-top:6px; border:1px dashed var(--border2); border-radius:10px; padding:10px; background:rgba(56,189,248,0.04);}
  .risk-fields .rf{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted);}
  .task-pick{margin-top:10px; border:1px dashed var(--border2); border-radius:10px; padding:10px; background:rgba(56,189,248,0.04);}
  .chk-list{display:flex; flex-direction:column; gap:6px; max-height:220px; overflow:auto;}
  .chk-list .chk{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); padding:4px 6px; border-radius:8px;}
  .chk-list .chk:hover{background:var(--panel2);}
  .chk-list .chk .c1{cursor:pointer; flex:1; min-width:0;}
  .chk-list .chk input[type=checkbox]{width:auto; min-height:auto; accent-color:#38BDF8;}
  .chk-list .chk .tprog{width:58px; text-align:center; padding:4px 6px; margin-left:auto; border-radius:8px; border:1px solid var(--border2); background:var(--bg2); color:var(--text); font-size:13px;}
  .chk-list .chk .cp{margin-left:auto; color:var(--accent); font-weight:700; font-size:12px;}
  .drawer{position:fixed; inset:0; z-index:60; display:flex; justify-content:flex-end;}
  .drawer-mask{position:absolute; inset:0; background:rgba(2,6,18,0.55);}
  .drawer-panel{position:relative; width:min(440px,92vw); height:100%; background:var(--bg); border-left:1px solid var(--border2); box-shadow:-12px 0 40px rgba(0,0,0,0.4); display:flex; flex-direction:column; animation:slidein .22s ease;}
  @keyframes slidein{from{transform:translateX(30px);opacity:.4;}to{transform:translateX(0);opacity:1;}}
  .drawer-panel .dp-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border2); background:var(--bg2);}
  .drawer-panel .dp-head #dpTitle{font-weight:700; font-size:15px; color:var(--text);}
  .drawer-panel .dp-head .x{background:none; border:none; color:var(--muted); font-size:22px; line-height:1; cursor:pointer; min-height:44px; min-width:44px;}
  .drawer-panel .dp-body{padding:16px 18px; overflow:auto; flex:1;}
  .drawer-panel .dp-rep{background:var(--panel); border:1px solid var(--border2); border-radius:10px; padding:10px 12px; margin-bottom:10px;}
  .drawer-panel .dp-rep .dr-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
  .drawer-panel .dp-rep .dr-h b{color:var(--text); font-size:13px;}
  .drawer-panel .dp-rep .cp{margin-left:auto; color:var(--accent); font-weight:700; font-size:12px;}
  .utag{font-size:12px; color:var(--muted); margin-right:6px; padding:4px 8px; border:1px solid var(--border2); border-radius:8px; white-space:nowrap;}
  .login-mask{position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; background:rgba(2,6,18,0.85); padding:20px;}
  .login-card{width:min(420px,96vw); background:var(--bg); border:1px solid var(--border2); border-radius:16px; padding:24px; text-align:center; box-shadow:0 24px 70px rgba(0,0,0,0.55);}
  .login-card h2{margin:0 0 6px; font-size:20px;}
  .login-card p{color:var(--muted); font-size:13px; margin:0 0 18px;}
  .login-card .row{display:flex; gap:8px; margin-top:10px;}
  .login-card input{flex:1;}
  .toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--border2); color:var(--text); padding:10px 16px; border-radius:10px; font-size:13px; z-index:100; box-shadow:0 10px 30px rgba(0,0,0,.4);}
  @media(max-width:768px){
    .wrap{padding:12px 12px 110px;}
    .kanban{display:flex; overflow-x:auto; gap:10px; scroll-snap-type:x mandatory; padding-bottom:6px;}
    .kcol{flex:0 0 82%;}
    .dash-grid{grid-template-columns:1fr;}
    nav{position:fixed; left:0; right:0; bottom:0; top:auto; border-radius:0; margin:0; border-left:none; border-right:none; border-bottom:none; padding:6px; padding-bottom:calc(6px + env(safe-area-inset-bottom)); background:#0c1426ee; backdrop-filter:blur(8px);}
    .brand h1{font-size:16px;}
    .acts button{padding:8px 10px; min-height:40px;}
  }
  ::-webkit-scrollbar{height:8px; width:8px;} ::-webkit-scrollbar-thumb{background:#2a3650; border-radius:8px;}

  /* 审批链 */
  .achain{display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin-top:10px;}
  .achip{font-size:12px; padding:3px 9px; border-radius:20px; border:1px solid var(--border2); color:var(--muted); background:var(--panel); white-space:nowrap;}
  .achip.ok{color:#34D399; border-color:#1d4d3a;}
  .achip.now{color:#F59E0B; border-color:#5b4a1f; box-shadow:0 0 0 2px rgba(245,158,11,.15);}
  .achip.no{color:#F87171; border-color:#5b2a2a;}
  .aarrow{color:var(--muted); font-size:11px;}
  .acur{margin-top:6px; font-size:12px; color:var(--muted);}
  .acur b{color:var(--accent);}
  .acur.ok{color:#34D399;} .acur.no{color:#F87171;}
  .mini.ghost{background:transparent; border:1px solid var(--border2); color:var(--muted);}
  /* 审批详情抽屉 */
  .ap-steps{padding:6px 0 14px;}
  .ap-step{display:flex; align-items:center; gap:10px; padding:8px 0;}
  .ap-ic{width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px; border:1px solid var(--border2); color:var(--muted);}
  .ap-step.ok .ap-ic{color:#34D399; border-color:#1d4d3a;}
  .ap-step.now .ap-ic{color:#F59E0B; border-color:#5b4a1f; box-shadow:0 0 0 2px rgba(245,158,11,.15);}
  .ap-step.no .ap-ic{color:#F87171; border-color:#5b2a2a;}
  .ap-role{font-weight:600; color:var(--text);}
  .ap-tag{margin-left:auto; font-size:11px; color:var(--muted);}
  .ap-line{height:14px; width:1px; background:var(--border2); margin-left:10px;}
  .ap-h5{margin:6px 0 8px; font-size:13px; color:var(--muted); border-top:1px solid var(--border2); padding-top:10px;}
  .ap-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:7px 0; border-bottom:1px dashed var(--border2);}
  .ap-ha{font-size:11px; padding:2px 8px; border-radius:6px; background:var(--panel2); color:var(--accent);}
  .ap-ha.reject{color:#F87171;} .ap-ha.approve{color:#34D399;}
  .ap-h b{font-size:13px; color:var(--text);} .ap-h small{color:var(--muted); font-size:11px;}
  .ap-hc{width:100%; font-size:12px; color:var(--muted); margin-top:2px;}

  /* 用户管理 */
  .rolelegend{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .usertable{display:flex; flex-direction:column; gap:8px;}
  .urow{display:flex; align-items:center; gap:10px; background:var(--panel2); border:1px solid var(--border2); border-radius:10px; padding:9px 12px;}
  .urow .un{display:flex; flex-direction:column; gap:1px; min-width:120px; flex:1;}
  .urow .un b{font-weight:600; font-size:14px;}
  .urow .uid{font-size:11px; color:var(--faint); word-break:break-all;}
  .urow .urole{min-width:120px; max-width:160px;}
  .urow .usave{min-height:36px; padding:6px 14px;}
  @media(max-width:768px){ .urow{flex-wrap:wrap;} .urow .urole{flex:1; max-width:none;} .urow .usave{margin-left:auto;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="#04121f" stroke-width="2" stroke-linejoin="round"/><path d="M12 7v10M3 7l9 5 9-5" stroke="#04121f" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <h1>太空字节项目管理工作台</h1>
        <div class="sub">V1.0 · 飞书接入 · 共享数据库 · 服务端权限</div>
      </div>
    </div>
    <div class="acts">
      <span id="userTag" class="utag">未登录</span>
      <button class="ghost" id="btnLogout">退出登录</button>
    </div>
  </header>

  <section class="today">
    <h2>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/></svg>
      今天要处理
    </h2>
    <div class="today-list" id="todayList"></div>
  </section>

  <nav>
    <button data-tab="projects" class="on">项目池</button>
    <button data-tab="tasks">任务拆解</button>
    <button data-tab="reports">周报</button>
    <button data-tab="dash">数据看板</button>
    <button data-tab="users" id="navUsers">用户管理</button>
  </nav>

  <!-- 项目池 -->
  <section class="module on" id="m-projects">
    <div class="module-head">
      <h2>项目池</h2>
      <span class="sp"></span>
      <button class="primary mini" id="btnAddP" data-act="btnAddP">+ 新建项目</button>
    </div>
    <div class="panel" id="projFormPanel" style="display:none">
      <h3 id="projFormTitle">新建项目</h3>
      <div class="form-grid">
        <label class="fld"><span>项目编号</span><input id="p_code" placeholder="PRJ-001"></label>
        <label class="fld"><span>项目名称 *</span><input id="p_name" placeholder="项目名称"></label>
        <label class="fld"><span>类型</span><select id="p_type"><option value="A类（交付类）">A类（交付类）</option><option value="B类（产品迭代）">B类（产品迭代）</option><option value="C类（基建类）">C类（基建类）</option></select></label>
        <label class="fld"><span>客户/归属</span><input id="p_customer" placeholder="客户或内部部门"></label>
        <label class="fld"><span>预算金额（万元）</span><input id="p_amount" placeholder="如 120（万元）"></label>
        <label class="fld"><span>项目负责人</span><select id="p_pm"></select></label>
      </div>
      <label class="fld" style="margin-top:10px"><span>项目背景 *</span><textarea id="p_bg" placeholder="项目背景说明"></textarea></label>
      <label class="fld" style="margin-top:10px"><span>项目目标</span><textarea id="p_goal" placeholder="用一个目标概括本项目要达成的结果"></textarea></label>
      <div class="ms-editor">
        <div style="display:flex;align-items:center;gap:10px;margin:4px 0 8px;">
          <span style="font-size:12px;color:var(--muted)">里程碑（按目标拆解，可添加多个）</span>
          <button type="button" class="mini ghost" id="btnAddMs" data-act="addms">+ 添加里程碑</button>
        </div>
        <div id="msEditor" class="ms-rows"></div>
      </div>
      <div class="row-actions">
        <button class="primary" id="btnSaveP">保存</button>
        <button class="ghost" id="btnCancelP">取消</button>
      </div>
    </div>
    <div class="cards" id="projCards"></div>
  </section>

  <!-- 任务拆解 -->
  <section class="module" id="m-tasks">
    <div class="module-head">
      <h2>任务拆解</h2>
      <select id="t_filter" style="min-height:40px;width:auto;"><option value="">全部项目</option></select>
      <span class="sp"></span>
      <button class="primary mini" id="btnAddT" data-act="btnAddT">+ 新建任务</button>
    </div>
    <div class="panel" id="taskFormPanel" style="display:none">
      <h3 id="taskFormTitle">新建任务</h3>
      <div class="form-grid">
        <label class="fld"><span>所属项目 *</span><select id="t_project"></select></label>
        <label class="fld"><span>关联里程碑</span><select id="t_ms"><option value="">不关联</option></select></label>
        <label class="fld"><span>任务编号</span><input id="t_code" placeholder="T-001"></label>
        <label class="fld"><span>任务名称 *</span><input id="t_name" placeholder="任务名称"></label>
        <label class="fld"><span>负责人</span><select id="t_owner"></select></label>
        <label class="fld"><span>估算工时（人天）</span><input id="t_est" placeholder="如 5"></label>
        <label class="fld"><span>开始日期</span><input id="t_start" type="date"></label>
        <label class="fld"><span>截止日期</span><input id="t_due" type="date"></label>
        <label class="fld"><span>状态</span><select id="t_status"><option>待开始</option><option>进行中</option><option>阻塞</option><option>完成</option></select></label>
        <label class="fld"><span>进度(%)</span><input id="t_progress" type="number" min="0" max="100" value="0"></label>
        <label class="fld" style="flex-direction:row; align-items:center; gap:8px;"><input id="t_crit" type="checkbox" style="width:auto;min-height:auto;"> <span>关键路径</span></label>
      </div>
      <div class="row-actions">
        <button class="primary" id="btnSaveT">保存</button>
        <button class="ghost" id="btnCancelT">取消</button>
      </div>
    </div>
    <div class="kanban" id="kanban"></div>
  </section>

  <!-- 周报 -->
  <section class="module" id="m-reports">
    <div class="module-head">
      <h2>周报</h2>
      <span class="sp"></span>
      <button class="primary mini" id="btnAddR" data-act="btnAddR">+ 写周报</button>
    </div>
    <div class="panel" id="repFormPanel" style="display:none">
      <h3 id="repFormTitle">写周报</h3>
      <div class="form-grid">
        <label class="fld"><span>所属项目 *</span><select id="r_project"></select></label>
        <label class="fld"><span>周次</span><input id="r_week" placeholder="如 2026-W32"></label>
      </div>
      <label class="fld" style="margin-top:10px"><span>本周完成</span><textarea id="r_done"></textarea></label>
      <label class="fld" style="margin-top:10px"><span>下周计划</span><textarea id="r_plan"></textarea></label>
      <div class="risk-fields">
        <label class="rf"><span>风险/问题</span><input id="r_risk" placeholder="描述"></label>
        <label class="rf"><span>风险截止</span><input id="r_risk_due" type="date"></label>
      </div>
      <label class="fld" style="margin-top:10px"><span>所需资源/支持</span><textarea id="r_res"></textarea></label>
      <div class="task-pick">
        <span class="tp-h">关联任务（勾选并填写当时进度，将回写任务进度）</span>
        <div class="chk-list" id="r_taskpick"></div>
      </div>
      <div class="row-actions">
        <button class="primary" id="btnSaveR">保存</button>
        <button class="ghost" id="btnCancelR">取消</button>
      </div>
    </div>
    <div id="repList"></div>
  </section>

  <!-- 数据看板 -->
  <section class="module" id="m-dash">
    <div class="module-head"><h2>数据看板</h2></div>
    <div class="metrics" id="metrics"></div>
    <div class="dash-grid">
      <div class="panel"><h3>项目状态分布</h3><div id="dashStatus"></div></div>
      <div class="panel"><h3>任务状态分布</h3><div id="dashTasks"></div></div>
    </div>
  </section>

  <!-- 用户管理（仅管理员） -->
  <section class="module" id="m-users">
    <div class="module-head"><h2>用户管理</h2></div>
    <div id="usersBody"></div>
  </section>
</div>

<div id="taskDrawer" class="drawer" style="display:none">
  <div class="drawer-mask" onclick="window.closeTaskDrawer()"></div>
  <div class="drawer-panel">
    <div class="dp-head"><span id="dpTitle"></span><button class="x" onclick="window.closeTaskDrawer()">×</button></div>

    <div class="dp-head"><span id="apTitle">审批详情</span><button class="x" onclick="window.closeApprovalDrawer()">×</button></div>
    <div class="dp-body" id="apBody"></div>
  </div>
</div>

<div id="loginMask" class="login-mask">
  <div class="login-card">
    <h2>太空字节 · 项目管理工作台</h2>
    <p>请登录后使用（数据全公司共享）</p>
    <button class="primary" id="btnFeishuLogin" style="width:100%">飞书登录</button>
    <div class="row">
      <input id="devName" placeholder="开发模式：输入姓名">
      <button class="ghost" id="btnDevLogin">开发登录</button>
    </div>
  </div>
</div>

<script>
(function(){
  var API='/api';
  var token=sessionStorage.getItem('pm_token')||'';
  var me=null;
  var usersMap={};
  var state={projects:[],milestones:[],tasks:[],reports:[],users:[],cfg:{templates:null,roles:null}};
  var projMs=[];          // 项目表单内正在编辑的里程碑（{id,name,due}）
  var taskFilter='';      // 任务面板：按项目筛选
  var activeTab='projects';
  var editingProjectId=null, editingTaskId=null, editingReportId=null;
  var TODAY=new Date(); TODAY.setHours(0,0,0,0);
  var TYPES=['A类（交付类）','B类（产品迭代）','C类（基建类）'];
  var STATUSES=['待开始','进行中','阻塞','完成'];

  function $(id){return document.getElementById(id);}
  function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fmtDate(s){ if(!s) return ''; var d=new Date(s); if(isNaN(d.getTime())) return s; return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function nm(oid){ return usersMap[oid]||oid||'—'; }
  function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},2600); }

  function api(method,path,body){
    var opt={method:method,headers:{'Content-Type':'application/json'}};
    if(token) opt.headers['Authorization']='Bearer '+token;
    if(body!==undefined) opt.body=JSON.stringify(body);
    return fetch(API+path,opt).then(function(r){
      if(r.status===401){ showLogin(); throw new Error('登录已过期，请重新登录'); }
      if(!r.ok) return r.json().then(function(e){ throw new Error(e.error||('请求失败 '+r.status)); });
      var ct=r.headers.get('content-type')||'';
      return ct.indexOf('application/json')>=0 ? r.json() : null;
    });
  }
  function reloadData(){
    return Promise.all([api('GET','/projects'),api('GET','/milestones'),api('GET','/tasks'),api('GET','/reports'),api('GET','/users'),api('GET','/approval-config')])
      .then(function(a){ state.projects=a[0]; state.milestones=a[1]; state.tasks=a[2]; state.reports=a[3]; state.users=a[4];
        state.cfg.templates=a[5].templates; state.cfg.roles=a[5].roles;
        usersMap={}; state.users.forEach(function(u){usersMap[u.open_id]=u.name;}); renderAll(); });
  }
  function findProject(id){ return state.projects.filter(function(p){return p.id===id;})[0]; }
  function milestonesOf(pid){ return state.milestones.filter(function(m){return m.project_id===pid;}); }
  function tasksOf(pid){ return state.tasks.filter(function(t){return t.project_id===pid;}); }
  function msTasks(mid){ return state.tasks.filter(function(t){return t.ms_id===mid;}); }
  function msDone(m){ var ts=msTasks(m.id); return ts.length ? ts.every(function(t){return t.status==='完成';}) : (m.done===1); }

  /* 权限 */
  function canEditProject(p){ return me && (me.role==='admin' || (p&&p.pm===me.open_id)); }
  function canDeleteProject(){ return me && me.role==='admin'; }
  function canEditTask(t){ var p=findProject(t.project_id); return me && (me.role==='admin' || (t&&t.owner===me.open_id) || (p&&p.pm===me.open_id)); }
  function canEditReport(r){ return me && (me.role==='admin' || (r&&r.author===me.open_id)); }

  /* 审批流（模板来自后端 approval-config，单一数据源） */
  function projTemplate(p){ return (state.cfg.templates&&state.cfg.templates[p.type]) || (state.cfg.templates&&state.cfg.templates['_default']) || ['pm','tl']; }
  function currentApproverRole(p){ if(!p||p.status!=='审批中') return null;
    var tpl=projTemplate(p); var step=(p.approval_step==null)?-1:p.approval_step;
    if(step<0||step>=tpl.length) return null; return tpl[step]; }
  function canApproveProject(p){ if(!me||!state.cfg.templates) return false; var r=currentApproverRole(p); if(!r) return false; return me.role==='admin'||me.role===r; }
  function roleName(r){ return (state.cfg.roles&&state.cfg.roles[r])||r; }
  function approversOfRole(r){ return state.users.filter(function(u){return u.role===r;}).map(function(u){return u.name;}); }
  // 审批链 UI：串行步骤 + 当前审批人
  function approvalChainHtml(p){
    if(!state.cfg.templates) return '';
    var tpl=projTemplate(p); var step=(p.approval_step==null)?-1:p.approval_step;
    var chips=tpl.map(function(role,i){
      var st='pending';
      if(p.status==='已驳回') st=(i<step?'approved':(i===step?'rejected':'pending'));
      else if(p.status==='已批准') st='approved';
      else if(p.status==='审批中') st=(i<step?'approved':(i===step?'current':'pending'));
      var sym=st==='approved'?'✓':(st==='current'?'●':(st==='rejected'?'✗':'○'));
      var cls=st==='approved'?'ok':(st==='current'?'now':(st==='rejected'?'no':''));
      return '<span class="achip '+cls+'">'+sym+' '+esc(roleName(role))+'</span>';
    }).join('<span class="aarrow">→</span>');
    var cur=currentApproverRole(p);
    var who=cur?approversOfRole(cur):[];
    var line='<div class="achain">'+chips+'</div>';
    if(p.status==='审批中'&&cur){ line+='<div class="acur">当前待 <b>'+esc(roleName(cur))+'</b> 审批'+(who.length?('：'+esc(who.join('、'))):'（暂无该角色成员，请联系管理员分配）')+'</div>'; }
    else if(p.status==='已批准') line+='<div class="acur ok">审批已全部通过</div>';
    else if(p.status==='已驳回') line+='<div class="acur no">审批被驳回，可修改后重新提交</div>';
    return line;
  }

  /* 登录 */
  function showLogin(){ $('loginMask').style.display='flex'; $('userTag').textContent='未登录'; $('navUsers').style.display='none'; }
  function afterLogin(d){ token=d.token; me=d.user; sessionStorage.setItem('pm_token',token);
    $('loginMask').style.display='none';
    $('userTag').textContent='登录：'+me.name+(me.role==='admin'?'（管理员）':'');
    reloadData(); }
  function feishuLogin(){
    fetch(API+'/appid').then(function(r){return r.json();}).then(function(d){
      try{ tt.requestAuthCode({appId:d.appId||'',
        success:function(res){ api('POST','/login',{code:res.code}).then(afterLogin).catch(function(e){toast('登录失败：'+e.message);}); },
        fail:function(){ toast('飞书登录失败，可改用开发登录'); } }); }
      catch(e){ toast('当前非飞书环境，请用开发登录'); }
    }).catch(function(){ toast('无法获取应用配置'); });
  }
  function devLogin(){ var n=$('devName').value.trim()||'开发用户'; api('POST','/devlogin',{name:n}).then(afterLogin).catch(function(e){toast('登录失败：'+e.message);}); }

  /* 渲染 */
  function renderAll(){ renderToday(); renderProjects(); renderTasks(); renderReports(); renderDash(); renderUsers();
    $('navUsers').style.display = (me && me.role==='admin') ? '' : 'none'; }

  function renderToday(){
    var items=[];
    state.tasks.forEach(function(t){
      if(t.status==='完成'||!t.due) return;
      var due=new Date(t.due); if(isNaN(due.getTime())) return;
      var diff=Math.ceil((due-TODAY)/864e5);
      if(due<TODAY) items.push({t:t,over:true,label:'已逾期'});
      else if(diff>=0&&diff<=3) items.push({t:t,over:false,label:diff===0?'今天到期':(diff+'天后到期')});
    });
    items.sort(function(a,b){ return (a.over?0:1)-(b.over?0:1); });
    var html='';
    if(!items.length) html='<div class="today-empty">暂无临期或逾期任务 🎉</div>';
    items.slice(0,12).forEach(function(it){
      var p=findProject(it.t.project_id);
      html+='<div class="today-item'+(it.over?' over':'')+'"><div class="tx"><b>'+esc(it.t.name||it.t.code)+'</b> <small>'+(p?esc(p.name):'未关联项目')+' · 负责人 '+esc(nm(it.t.owner))+'</small></div><span class="tag">'+(it.over?'⚠ ':'')+it.label+'</span></div>';
    });
    $('todayList').innerHTML=html;
  }

  function renderProjects(){
    fillUserSelect('p_pm'); fillUserSelect('t_owner');
    var html='';
    if(!state.projects.length) html='<div class="empty">还没有项目，点右上角「新建项目」开始</div>';
    state.projects.forEach(function(p){
      var typeChar=(TYPES.indexOf(p.type)>=0)?['A','B','C'][TYPES.indexOf(p.type)]:'·';
      var g=p.goal?p.goal:''; if(g&&typeof g==='object') g=g.text||'';
      var ms=milestonesOf(p.id);
      var msHtml=ms.map(function(m){ var d=msDone(m); var cnt=msTasks(m.id).length;
        return '<span class="m'+(d?' done':'')+(cnt?' derived':'')+'" data-act="ms" data-id="'+m.id+'">'+(cnt?cnt+'任务·自动':esc(m.name))+(m.due?' · '+fmtDate(m.due):'')+'</span>'; }).join('');
      var act='';
      if((p.status==='草稿'||p.status==='已驳回')&&canEditProject(p)) act+='<button class="mini primary" data-act="submit" data-id="'+p.id+'">提交审批</button>';
      if(p.status==='审批中'&&canApproveProject(p)){ act+='<button class="mini primary" data-act="approve" data-id="'+p.id+'">通过</button><button class="mini" data-act="reject" data-id="'+p.id+'">驳回</button>'; }
      if(p.status==='已批准'&&canEditProject(p)) act+='<button class="mini primary" data-act="start" data-id="'+p.id+'">启动项目</button>';
      if(p.status==='已启动'&&canEditProject(p)) act+='<button class="mini" data-act="close" data-id="'+p.id+'">结项</button>';
      act+='<button class="mini ghost" data-act="approval" data-id="'+p.id+'">审批详情</button>';
      if(canEditProject(p)) act+='<button class="mini" data-act="editp" data-id="'+p.id+'">编辑</button>';
      if(canDeleteProject()) act+='<button class="mini danger" data-act="delp" data-id="'+p.id+'">删除</button>';
      html+='<div class="card"><div class="topline"><span class="badge '+typeChar+'">'+typeChar+'</span>'+
        '<span class="pill '+esc(p.status)+'">'+esc(p.status)+'</span></div>'+
        '<h4>'+esc(p.name)+'</h4>'+
        '<div class="meta"><span>编号 <b>'+esc(p.code||'—')+'</b></span><span>负责人 <b>'+esc(nm(p.pm))+'</b></span>'+
        (p.customer?'<span>归属 <b>'+esc(p.customer)+'</b></span>':'')+(p.amount?'<span>预算 <b>'+esc(p.amount)+'</b></span>':'')+'</div>'+
        (p.background?'<div class="bg"><b>背景：</b>'+esc(p.background)+'</div>':'')+
        (g?'<div class="goals"><span class="goal">目标 <b>'+esc(g)+'</b></span></div>':'')+
        (msHtml?'<div class="ms">'+msHtml+'</div>':'')+
        approvalChainHtml(p)+
        (act?'<div class="acts2">'+act+'</div>':'')+'</div>';
    });
    $('projCards').innerHTML=html;
  }

  function renderTasks(){
    fillProjectSelect('t_project'); fillFilterSelect('t_filter');
    var html='';
    var base=state.tasks.filter(function(t){ return !taskFilter || t.project_id===taskFilter; });
    STATUSES.forEach(function(st){
      var list=base.filter(function(t){return t.status===st;});
      html+='<div class="kcol"><h4>'+st+'<span class="n">'+list.length+'</span></h4>';
      list.forEach(function(t){
        var p=findProject(t.project_id);
        var over=t.due&&t.status!=='完成'&&new Date(t.due)<TODAY;
        var mName=t.ms_id?(state.milestones.filter(function(m){return m.id===t.ms_id;})[0]):null;
        var repCount=state.reports.filter(function(r){return r.tasks&&r.tasks.some(function(x){return x.id===t.id;});}).length;
        html+='<div class="ktask'+(over?' over':'')+'">'+
          '<span class="kc">'+esc(t.code||'')+'</span>'+
          (canEditTask(t)?'<span class="edt" data-act="edt" data-id="'+t.id+'">编辑</span>':'')+
          (canEditTask(t)?'<span class="del" data-act="delt" data-id="'+t.id+'">删除</span>':'')+
          '<div class="kn">'+esc(t.name)+'</div>'+
          '<div class="ko"><span>'+esc(nm(t.owner))+(t.crit?' <span class="crit">关键</span>':'')+(t.est?' <span>'+esc(t.est)+'人天</span>':'')+'</span>'+
          (mName?'<span class="mstag">'+esc(mName.name)+'</span>':'')+'</div>'+
          '<div class="pbar"><i style="width:'+(t.progress||0)+'%"></i></div>'+
          '<select data-act="chg" data-id="'+t.id+'">'+STATUSES.map(function(s){return '<option'+(s===t.status?' selected':'')+'>'+s+'</option>';}).join('')+'</select>'+
          '<div class="kfoot"><span class="lk" data-act="rep" data-id="'+t.id+'">📋 关联周报 '+repCount+'</span></div>'+
          '</div>';
      });
      if(!list.length) html+='<div class="empty">—</div>';
      html+='</div>';
    });
    $('kanban').innerHTML=html;
  }

  function renderReports(){
    fillProjectSelect('r_project');
    var html='';
    if(!state.reports.length) html='<div class="empty">还没有周报</div>';
    state.reports.forEach(function(r){
      var p=findProject(r.project_id);
      var tsk=(r.tasks||[]).map(function(t){return esc(t.code||t.name)+' '+esc(t.progress||0)+'%';}).join('、');
      var can=canEditReport(r);
      html+='<div class="rep"><div class="rh"><b>'+(p?esc(p.name):'未关联')+'</b>'+
        '<span class="pill">'+esc(r.week||'')+'</span><span class="pill">'+esc(nm(r.author))+'</span>'+
        (can?'<span class="lk" data-act="editr" data-id="'+r.id+'" style="margin-left:auto">编辑</span>':'')+
        (can?'<span class="del" data-act="delr" data-id="'+r.id+'">删除</span>':'')+'</div>'+
        (r.done?'<div class="sec"><b>本周完成：</b>'+esc(r.done)+'</div>':'')+
        (r.plan?'<div class="sec"><b>下周计划：</b>'+esc(r.plan)+'</div>':'')+
        (r.risk?'<div class="sec"><b>风险：</b>'+esc(r.risk)+(r.risk_due?'（截止 '+fmtDate(r.risk_due)+'）':'')+'</div>':'')+
        (r.res?'<div class="sec"><b>所需支持：</b>'+esc(r.res)+'</div>':'')+
        (tsk?'<div class="tsk">关联任务：'+tsk+'</div>':'')+'</div>';
    });
    $('repList').innerHTML=html;
  }

  function renderUsers(){
    if(!me || me.role!=='admin'){ $('usersBody').innerHTML=''; return; }
    var roles=state.cfg.roles||{}; var keys=Object.keys(roles);
    var html='<div class="panel"><h3>用户与审批角色</h3>';
    html+='<p class="hint">审批流按「角色」自动解析审批人。在此把飞书用户绑定到审批角色（每个角色可绑定多人）。同事首次通过飞书登录即自动进入此列表。</p>';
    if(keys.length) html+='<div class="rolelegend">'+keys.map(function(r){return '<span class="achip">'+esc(roles[r])+'</span>';}).join(' ')+'</div>';
    html+='<div class="usertable">';
    var sorted=state.users.slice().sort(function(a,b){ var ia=keys.indexOf(a.role), ib=keys.indexOf(b.role); return (ia<0?99:ia)-(ib<0?99:ib) || (a.name||'').localeCompare(b.name||''); });
    sorted.forEach(function(u){
      var opts=keys.map(function(r){return '<option value="'+r+'"'+(u.role===r?' selected':'')+'>'+esc(roles[r])+'</option>';}).join('');
      html+='<div class="urow"><div class="un"><b>'+esc(u.name)+'</b><span class="uid">飞书ID '+esc(u.open_id)+'</span></div>'+
        '<select class="urole" id="role_'+u.id+'">'+opts+'</select>'+
        '<button class="mini primary usave" data-act="saveRole" data-id="'+u.id+'">保存</button></div>';
    });
    html+='</div></div>';
    $('usersBody').innerHTML=html;
  }
  function renderDash(){
    var totalProjects=state.projects.length;
    var byStatus={}; state.projects.forEach(function(p){byStatus[p.status]=(byStatus[p.status]||0)+1;});
    var totalTasks=state.tasks.length;
    var doneTasks=state.tasks.filter(function(t){return t.status==='完成';}).length;
    var overdue=state.tasks.filter(function(t){return t.status!=='完成'&&t.due&&new Date(t.due)<TODAY;}).length;
    var msTotal=state.milestones.length; var msDoneN=state.milestones.filter(function(m){return msDone(m);}).length;
    var comp=totalTasks?Math.round(doneTasks/totalTasks*100):0;
    var mcomp=msTotal?Math.round(msDoneN/msTotal*100):0;
    $('metrics').innerHTML=
      metric(totalProjects,'项目总数')+
      metric(comp+'%','任务完成率','ok')+
      metric(overdue,'逾期任务',overdue?'danger':'ok')+
      metric(state.reports.length,'周报数')+
      metric(mcomp+'%','里程碑达成率');
    var stColors={'草稿':'#64748B','审批中':'#F59E0B','已批准':'#38BDF8','已启动':'#34D399','已结项':'#5C6B88'};
    $('dashStatus').innerHTML=barList(byStatus,stColors);
    var tkColors={'待开始':'#64748B','进行中':'#38BDF8','阻塞':'#F87171','完成':'#34D399'};
    var tkStatus={}; STATUSES.forEach(function(s){tkStatus[s]=state.tasks.filter(function(t){return t.status===s;}).length;});
    $('dashTasks').innerHTML=barList(tkStatus,tkColors);
  }
  function metric(v,l,cls){ return '<div class="metric"><div class="v'+(cls?' '+cls:'')+'">'+v+'</div><div class="l">'+l+'</div></div>'; }
  function barList(map,colors){
    var max=Math.max(1,Math.max.apply(null,Object.keys(map).map(function(k){return map[k];})));
    return Object.keys(map).map(function(k){
      var c=colors[k]||'#38BDF8'; var pct=Math.round(map[k]/max*100);
      return '<div class="bar"><span class="nm">'+esc(k)+'</span><div class="track"><div class="fill" style="width:'+pct+'%;background:'+c+'"></div><span class="txt">'+map[k]+'</span></div></div>';
    }).join('');
  }

  /* 下拉填充 */
  function fillUserSelect(id){ var s=$(id); if(!s) return; var cur=s.value;
    s.innerHTML='<option value="">未指定</option>'+state.users.map(function(u){return '<option value="'+u.open_id+'">'+esc(u.name)+(u.role==='admin'?'（管理员）':'')+'</option>';}).join(''); s.value=cur; }
  function fillProjectSelect(id){ var s=$(id); if(!s) return; var cur=s.value;
    s.innerHTML=state.projects.map(function(p){return '<option value="'+p.id+'">'+esc(p.code||'')+' '+esc(p.name)+'</option>';}).join(''); s.value=cur; }
  function fillFilterSelect(id){ var s=$(id); if(!s) return; var cur=s.value;
    s.innerHTML='<option value="">全部项目</option>'+state.projects.map(function(p){return '<option value="'+p.id+'">'+esc(p.code||'')+' '+esc(p.name)+'</option>';}).join(''); s.value=cur; }

  /* 表单显隐 */
  function showProjForm(p){ editingProjectId=p?p.id:null; $('projFormTitle').textContent=p?'编辑项目':'新建项目';
    $('p_code').value=p?p.code||'':''; $('p_name').value=p?p.name:''; $('p_type').value=p?p.type:TYPES[0];
    $('p_customer').value=p?p.customer||'':''; $('p_amount').value=p?p.amount||'':'';
    $('p_pm').value=p?p.pm||'':''; $('p_bg').value=p?p.background||'':'';
    var g=p&&p.goal?p.goal:''; if(g&&typeof g==='object') g=g.text||'';
    $('p_goal').value=g;
    projMs=(p?milestonesOf(p.id):[]).map(function(m){return {id:m.id,name:m.name,due:m.due||''};});
    renderMsEditor();
    $('projFormPanel').style.display='block'; }
  function renderMsEditor(){
    $('msEditor').innerHTML = projMs.map(function(m,i){
      return '<div class="ms-row" data-id="'+esc(m.id||'')+'"><input class="ms-name" value="'+esc(m.name||'')+'" placeholder="里程碑名称">'
        +'<input type="date" class="ms-due" value="'+esc(m.due||'')+'">'
        +'<button type="button" class="mini ghost" data-act="msrm" data-i="'+i+'">移除</button></div>';
    }).join('') || '<div class="empty" style="padding:4px">暂无里程碑，点上方「+ 添加里程碑」</div>';
  }
  function readProjMs(){
    var rows=$('msEditor').querySelectorAll('.ms-row'); var arr=[];
    Array.prototype.forEach.call(rows,function(row){
      var name=row.querySelector('.ms-name').value.trim();
      var due=row.querySelector('.ms-due').value;
      if(!name) return;
      arr.push({id:row.getAttribute('data-id')||null, name:name, due:due});
    });
    return arr;
  }
  function showTaskForm(t){ editingTaskId=t?t.id:null; $('taskFormTitle').textContent=t?'编辑任务':'新建任务';
    fillProjectSelect('t_project'); $('t_project').value=t?t.project_id:(taskFilter||''); fillMsSelect(t?t.project_id:(taskFilter||''));
    $('t_ms').value=t?t.ms_id||'':'';
    $('t_code').value=t?t.code||'':''; $('t_name').value=t?t.name:''; $('t_owner').value=t?t.owner||'':'';
    $('t_est').value=t?t.est||'':''; $('t_start').value=t?fmtDate(t.start):''; $('t_due').value=t?fmtDate(t.due):'';
    $('t_status').value=t?t.status:'待开始'; $('t_progress').value=t?t.progress||0:0; $('t_crit').checked=t?!!t.crit:false;
    $('taskFormPanel').style.display='block'; }
  function fillMsSelect(pid){ var s=$('t_ms'); var cur=s.value; s.innerHTML='<option value="">不关联</option>'+milestonesOf(pid).map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+'</option>';}).join(''); s.value=cur; }
  function showRepForm(r){ editingReportId=r?r.id:null; $('repFormTitle').textContent=r?'编辑周报':'写周报';
    fillProjectSelect('r_project'); $('r_project').value=r?r.project_id:''; $('r_week').value=r?r.week||'':'';
    $('r_done').value=r?r.done||'':''; $('r_plan').value=r?r.plan||'':'';
    $('r_risk').value=r?r.risk||'':''; $('r_risk_due').value=r?fmtDate(r.risk_due):''; $('r_res').value=r?r.res||'':'';
    renderRepTaskPick(r); $('repFormPanel').style.display='block'; }
  function renderRepTaskPick(r){ var pid=$('r_project').value;
    if(!pid){ $('r_taskpick').innerHTML='<div class="empty">请先在上方选择项目，再从该项目任务中勾选关联</div>'; return; }
    var list=tasksOf(pid); var checks=(r&&r.tasks)?r.tasks.map(function(t){return t.id;}):[];
    $('r_taskpick').innerHTML=list.map(function(t){ var snap=(r&&r.snap&&r.snap[t.id]!=null)?r.snap[t.id]:t.progress;
      return '<label class="chk"><input type="checkbox" value="'+t.id+'"'+(checks.indexOf(t.id)>=0?' checked':'')+'><span class="c1">'+esc(t.code||'')+' '+esc(t.name)+'</span>'+
      '<input class="tprog" type="number" min="0" max="100" value="'+(snap||0)+'" data-id="'+t.id+'"></label>'; }).join('')||'<div class="empty">该项目暂无任务，请先在「任务拆解」中创建</div>'; }

  /* 保存 */
  function saveProject(){ var projStatus = editingProjectId ? ((findProject(editingProjectId)||{}).status||'草稿') : '草稿';
    var b={code:$('p_code').value.trim(),name:$('p_name').value.trim(),type:$('p_type').value,
    customer:$('p_customer').value.trim(),amount:$('p_amount').value.trim(),status:projStatus,
    pm:$('p_pm').value||null,
    background:$('p_bg').value.trim(),goal:$('p_goal').value.trim()};
    if(!b.name){toast('请填写项目名称');return;}
    var msList=readProjMs();
    var origIds=projMs.filter(function(m){return m.id;}).map(function(m){return m.id;});
    var call=editingProjectId?api('PUT','/projects/'+editingProjectId,b):api('POST','/projects',b);
    call.then(function(p){
      var pid=p.id;
      var nowIds=msList.map(function(m){return m.id;}).filter(Boolean);
      var toDelete=origIds.filter(function(id){return nowIds.indexOf(id)<0;});
      var chain=Promise.resolve();
      toDelete.forEach(function(id){ chain=chain.then(function(){return api('DELETE','/milestones/'+id);}); });
      msList.forEach(function(m){
        if(m.id) chain=chain.then(function(){return api('PUT','/milestones/'+m.id,{name:m.name,due:m.due});});
        else chain=chain.then(function(){return api('POST','/milestones',{project_id:pid,name:m.name,due:m.due});});
      });
      return chain;
    }).then(function(){ $('projFormPanel').style.display='none'; reloadData(); toast('已保存'); }).catch(function(e){toast(e.message);}); }
  function saveTask(){ var pid=$('t_project').value; if(!pid){toast('请选择所属项目');return;}
    var b={project_id:pid,ms_id:$('t_ms').value||null,code:$('t_code').value.trim(),name:$('t_name').value.trim(),
      owner:$('t_owner').value||null,est:$('t_est').value.trim(),start:$('t_start').value||null,due:$('t_due').value||null,
      status:$('t_status').value,progress:parseInt($('t_progress').value||0,10),crit:$('t_crit').checked};
    if(!b.name){toast('请填写任务名称');return;}
    var call=editingTaskId?api('PUT','/tasks/'+editingTaskId,b):api('POST','/tasks',b);
    call.then(function(){ $('taskFormPanel').style.display='none'; reloadData(); toast('已保存'); }).catch(function(e){toast(e.message);}); }
  function saveReport(){ var pid=$('r_project').value; if(!pid){toast('请选择所属项目');return;}
    var taskIds=[],snap={}; Array.prototype.forEach.call($('r_taskpick').querySelectorAll('input[type=checkbox]'),function(c){
      if(c.checked){ taskIds.push(c.value); var tp=c.parentElement.querySelector('.tprog'); snap[c.value]=tp?parseInt(tp.value||0,10):0; } });
    var b={project_id:pid,week:$('r_week').value.trim(),done:$('r_done').value.trim(),plan:$('r_plan').value.trim(),
      risk:$('r_risk').value.trim(),risk_due:$('r_risk_due').value||null,res:$('r_res').value.trim(),taskIds:taskIds,snap:snap};
    var call=editingReportId?api('PUT','/reports/'+editingReportId,b):api('POST','/reports',b);
    call.then(function(){ // 回写任务进度
      var chain=Promise.resolve();
      taskIds.forEach(function(tid){ var t=state.tasks.filter(function(x){return x.id===tid;})[0]; if(t&&snap[tid]!=null&&t.progress!==snap[tid]){ chain=chain.then(function(){return api('PUT','/tasks/'+tid,{progress:snap[tid]});}); } });
      return chain;
    }).then(function(){ $('repFormPanel').style.display='none'; reloadData(); toast('已保存'); }).catch(function(e){toast(e.message);}); }

  /* 项目状态流转 */
  function setProjectStatus(id,status,extra){ var p=findProject(id); if(!p) return;
    var b={status:status}; if(extra) Object.assign(b,extra);
    api('PUT','/projects/'+id,b).then(function(){ reloadData(); toast('已更新为'+status); }).catch(function(e){toast(e.message);}); }

  /* 任务抽屉 */
  window.closeTaskDrawer=function(){ $('taskDrawer').style.display='none'; };
  window.closeApprovalDrawer=function(){ $('approvalDrawer').style.display='none'; };
  function openApprovalDrawer(pid){ var p=findProject(pid); if(!p) return;
    api('GET','/projects/'+pid+'/approval').then(function(v){
      var steps=v.steps.map(function(s){
        var ic=s.status==='approved'?'✓':(s.status==='current'?'●':(s.status==='rejected'?'✗':'○'));
        var cls=s.status==='approved'?'ok':(s.status==='current'?'now':(s.status==='rejected'?'no':''));
        return '<div class="ap-step '+cls+'"><span class="ap-ic">'+ic+'</span><span class="ap-role">'+esc(s.roleName)+'</span>'+
          (s.status==='current'?'<span class="ap-tag">待审批</span>':(s.status==='approved'?'<span class="ap-tag">已通过</span>':(s.status==='rejected'?'<span class="ap-tag">已驳回</span>':'<span class="ap-tag">未开始</span>')))+'</div>';
      }).join('<div class="ap-line"></div>');
      var hist=v.history.length? v.history.map(function(h){
        var an={submit:'提交审批',approve:'通过',reject:'驳回',reset:'重置'}[h.action]||h.action;
        return '<div class="ap-h"><span class="ap-ha '+h.action+'">'+an+'</span><b>'+esc(h.approver_name||'—')+'</b>'+
          '<small>'+esc(h.created_at)+'</small>'+(h.comment?'<div class="ap-hc">'+esc(h.comment)+'</div>':'')+'</div>';
      }).join('') : '<div class="empty">暂无审批记录</div>';
      $('apBody').innerHTML='<div class="ap-steps">'+steps+'</div><h5 class="ap-h5">审批记录</h5>'+hist;
      $('approvalDrawer').style.display='flex';
    }).catch(function(e){toast(e.message);}); }
  function openTaskDrawer(tid){ var t=state.tasks.filter(function(x){return x.id===tid;})[0]; if(!t) return;
    $('dpTitle').textContent='任务：'+(t.name||t.code);
    api('GET','/tasks/'+tid+'/reports').then(function(rows){
      var html='<div class="dp-task"><div class="pbar big"><i style="width:'+(t.progress||0)+'%"></i></div>'+
        '<div class="dp-h">当前进度 '+(t.progress||0)+'% · 负责人 '+esc(nm(t.owner))+'</div>';
      if(!rows.length) html+='<div class="empty">暂无关联周报</div>';
      rows.forEach(function(r){ var p=findProject(r.project_id);
        html+='<div class="dp-rep"><div class="dr-h"><b>'+(p?esc(p.name):'')+'</b><span class="pill">'+esc(r.week||'')+'</span>'+
          '<span class="cp">'+esc(nm(r.author))+'</span></div>'+
          (r.done?'<div class="sec"><b>完成：</b>'+esc(r.done)+'</div>':'')+
          (r.plan?'<div class="sec"><b>计划：</b>'+esc(r.plan)+'</div>':'')+
          (r.risk?'<div class="sec"><b>风险：</b>'+esc(r.risk)+'</div>':'')+'</div>'; });
      html+='</div>'; $('dpBody').innerHTML=html; $('taskDrawer').style.display='flex';
    }).catch(function(e){toast(e.message);}); }

  /* 事件 */
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(b){ var act=b.getAttribute('data-act'), id=b.getAttribute('data-id');
      if(act==='addp'||act==='btnAddP'){ showProjForm(null); }
      else if(act==='addt'||act==='btnAddT'){ showTaskForm(null); }
      else if(act==='addr'||act==='btnAddR'){ showRepForm(null); }
      else if(act==='addms'){ projMs.push({id:null,name:'',due:''}); renderMsEditor(); }
      else if(act==='msrm'){ var mi=+b.getAttribute('data-i'); if(!isNaN(mi)){ projMs.splice(mi,1); renderMsEditor(); } }
      else if(act==='editp'){ showProjForm(findProject(id)); }
      else if(act==='edt'){ showTaskForm(state.tasks.filter(function(t){return t.id===id;})[0]); }
      else if(act==='editr'){ showRepForm(state.reports.filter(function(r){return r.id===id;})[0]); }
      else if(act==='delp'){ if(confirm('确认删除该项目？此操作仅管理员可执行')){ api('DELETE','/projects/'+id).then(function(){reloadData();toast('已删除');}).catch(function(e){toast(e.message);}); } }
      else if(act==='delt'){ if(confirm('确认删除该任务？')){ api('DELETE','/tasks/'+id).then(function(){reloadData();toast('已删除');}).catch(function(e){toast(e.message);}); } }
      else if(act==='delr'){ if(confirm('确认删除该周报？')){ api('DELETE','/reports/'+id).then(function(){reloadData();toast('已删除');}).catch(function(e){toast(e.message);}); } }
      else if(act==='ms'){ var m=state.milestones.filter(function(x){return x.id===id;})[0]; if(!m) return;
        if(msTasks(id).length){ toast('该里程碑达成率由挂钩任务自动判定'); return; }
        api('PUT','/milestones/'+id,{done:!(m.done===1)}).then(reloadData).catch(function(e){toast(e.message);}); }
      else if(act==='rep'){ openTaskDrawer(id); }
      else if(act==='submit'){ api('POST','/projects/'+id+'/submit').then(function(){reloadData();toast('已提交审批');}).catch(function(e){toast(e.message);}); }
      else if(act==='approve'){ var cm=prompt('审批意见（可选）：',''); if(cm===null) return;
        api('POST','/projects/'+id+'/approve',{comment:cm}).then(function(){reloadData();toast('已通过当前审批步骤');}).catch(function(e){toast(e.message);}); }
      else if(act==='reject'){ var cm=prompt('驳回理由：',''); if(cm===null) return;
        api('POST','/projects/'+id+'/reject',{comment:cm}).then(function(){reloadData();toast('已驳回');}).catch(function(e){toast(e.message);}); }
      else if(act==='start'){ setProjectStatus(id,'已启动'); }
      else if(act==='close'){ setProjectStatus(id,'已结项'); }
      else if(act==='approval'){ openApprovalDrawer(id); }
      else if(act==='saveRole'){ var rid=$('role_'+id).value; api('PUT','/users/'+id+'/role',{role:rid}).then(function(){reloadData();toast('已更新角色');}).catch(function(e){toast(e.message);}); }
      return;
    }
    var nav=e.target.closest('[data-tab]'); if(nav){ var tab=nav.getAttribute('data-tab'); activeTab=tab;
      Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(x){x.classList.toggle('on',x===nav);});
      Array.prototype.forEach.call(document.querySelectorAll('.module'),function(m){m.classList.toggle('on',m.id==='m-'+tab);});
      if(tab==='dash') renderDash();
    }
  });
  document.addEventListener('change',function(e){
    var s=e.target.closest('select[data-act="chg"]'); if(s){ var id=s.getAttribute('data-id'); var t=state.tasks.filter(function(x){return x.id===id;})[0]; if(!t) return;
      var st=s.value; var b={status:st}; if(st==='完成') b.progress=100;
      api('PUT','/tasks/'+id,b).then(reloadData).catch(function(e){toast(e.message);}); return; }
    var tp=e.target.closest('#t_project'); if(tp){ fillMsSelect(tp.value); }
    var rp=e.target.closest('#r_project'); if(rp){ var cur=editingReportId?state.reports.filter(function(r){return r.id===editingReportId;})[0]:null; renderRepTaskPick(cur); }
    var tf=e.target.closest('#t_filter'); if(tf){ taskFilter=tf.value; renderTasks(); }
  });

  $('btnSaveP').onclick=saveProject; $('btnCancelP').onclick=function(){$('projFormPanel').style.display='none';};
  $('btnSaveT').onclick=saveTask; $('btnCancelT').onclick=function(){$('taskFormPanel').style.display='none';};
  $('btnSaveR').onclick=saveReport; $('btnCancelR').onclick=function(){$('repFormPanel').style.display='none';};
  $('btnLogout').onclick=function(){ token=''; me=null; sessionStorage.removeItem('pm_token'); showLogin(); };
  $('btnFeishuLogin').onclick=feishuLogin; $('btnDevLogin').onclick=devLogin;

  /* 启动 */
  function boot(){
    if(!token){ showLogin(); return; }
    api('GET','/me').then(function(d){ me=d.user; $('userTag').textContent='登录：'+me.name+(me.role==='admin'?'（管理员）':''); reloadData(); })
      .catch(function(){ showLogin(); });
  }
  boot();
})();
</script>
</body>
</html>
